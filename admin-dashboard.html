<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rocks Digital | Admin Dashboard</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #101010;
    color: white;
}

header {
    background: black;
    padding: 25px;
    text-align: center;
    border-bottom: 2px solid gold;
}

h1, h2 {
    color: gold;
}

.container {
    max-width: 900px;
    margin: 30px auto;
    padding: 20px;
}

.panel {
    background: #202020;
    padding: 25px;
    border: 1px solid gold;
    border-radius: 12px;
    margin-bottom: 25px;
}

input, textarea {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border: 1px solid #777;
    border-radius: 5px;
    font-size: 16px;
}

button {
    background: gold;
    color: black;
    padding: 12px 20px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
    margin: 5px;
}

button:hover {
    background: #e0bd00;
}

.delete {
    background: #e74c3c;
    color: white;
}

.product {
    background: #303030;
    padding: 15px;
    margin-top: 15px;
    border-radius: 8px;
}

.product h3 {
    color: gold;
}

a {
    color: gold;
}

.note {
    color: #ccc;
    font-size: 14px;
}
</style>
</head>

<body>

<header>
    <h1>ROCKS DIGITAL</h1>
    <p>Admin Dashboard</p>
</header>

<div class="container">

    <div class="panel">
        <h2>Manage Products</h2>

        <form id="productForm">
            <input
                type="text"
                id="productName"
                placeholder="Enter Product Name"
                required
            >

            <textarea
                id="productDescription"
                placeholder="Enter Product Description"
                required
            ></textarea>

            <input
                type="number"
                id="productPrice"
                placeholder="Enter Product Price (₹)"
                min="0"
                step="0.01"
                required
            >

            <button type="submit" id="saveButton">
                Add Product
            </button>

            <button type="button" onclick="resetForm()">
                Clear
            </button>
        </form>
    </div>

    <div class="panel">
        <h2>Product List</h2>

        <div id="productList"></div>
    </div>

    <div class="panel">
        <h2>Catalogue</h2>

        <p>
            <a href="index.html">
                Open Rocks Digital Catalogue
            </a>
        </p>

        <p class="note">
            This is a local demonstration dashboard.
            Products are saved in this browser only.
            Changes will not automatically appear
            on the public catalogue yet.
        </p>
    </div>

</div>

<script>
const STORAGE_KEY = "rocksDigitalProducts";

let products = [];

try {
    const saved = JSON.parse(
        localStorage.getItem(STORAGE_KEY) || "[]"
    );

    products = Array.isArray(saved) ? saved : [];
} catch (error) {
    products = [];
}

let editingIndex = -1;

const form = document.getElementById("productForm");

form.addEventListener("submit", function(event) {
    event.preventDefault();

    const name = document
        .getElementById("productName").value.trim();

    const description = document
        .getElementById("productDescription").value.trim();

    const price = Number(
        document.getElementById("productPrice").value
    );

    if (
        !name ||
        !description ||
        !Number.isFinite(price) ||
        price < 0
    ) {
        alert("Please enter valid product details.");
        return;
    }

    const product = {
        name: name,
        description: description,
        price: price
    };

    if (editingIndex === -1) {
        products.push(product);
    } else {
        products[editingIndex] = product;
    }

    if (!saveProducts()) return;

    resetForm();
    displayProducts();

    alert("Product saved successfully!");
});

function saveProducts() {
    try {
        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(products)
        );
        return true;
    } catch (error) {
        alert("Could not save products in this browser.");
        return false;
    }
}

function displayProducts() {
    const list = document.getElementById("productList");

    list.replaceChildren();

    if (products.length === 0) {
        const message = document.createElement("p");
        message.textContent = "No products added yet.";
        list.appendChild(message);
        return;
    }

    products.forEach(function(product, index) {
        const card = document.createElement("div");
        card.className = "product";

        const title = document.createElement("h3");
        title.textContent = product.name;

        const description = document.createElement("p");
        description.textContent = product.description;

        const price = document.createElement("p");
        price.textContent =
            "Price: ₹" + Number(product.price).toFixed(2);

        const editButton = document.createElement("button");
        editButton.textContent = "Edit";
        editButton.onclick = function() {
            editProduct(index);
        };

        const deleteButton = document.createElement("button");
        deleteButton.textContent = "Delete";
        deleteButton.className = "delete";
        deleteButton.onclick = function() {
            deleteProduct(index);
        };

        card.append(
            title,
            description,
            price,
            editButton,
            deleteButton
        );

        list.appendChild(card);
    });
}

function editProduct(index) {
    const product = products[index];

    document.getElementById("productName").value =
        product.name;

    document.getElementById("productDescription").value =
        product.description;

    document.getElementById("productPrice").value =
        product.price;

    editingIndex = index;

    document.getElementById("saveButton").textContent =
        "Update Product";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

function deleteProduct(index) {
    if (confirm("Are you sure you want to delete this product?")) {
        products.splice(index, 1);

        if (saveProducts()) {
            resetForm();
            displayProducts();
        }
    }
}

function resetForm() {
    form.reset();
    editingIndex = -1;

    document.getElementById("saveButton").textContent =
        "Add Product";
}

displayProducts();
</script>

</body>
</html>
